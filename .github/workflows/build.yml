name: build

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: ['**']

jobs:
  build:
    name: build ${{ matrix.env }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Representative env per chip family (classic ESP32 / S3 / C3)
        env: [esp32-2432s028, esp32-s3-devkit, esp32-c3-supermini]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}
          restore-keys: pio-${{ runner.os }}-
      - name: Install PlatformIO
        run: pip install platformio
      - name: Build ${{ matrix.env }}
        run: pio run -e ${{ matrix.env }}
      - name: Stage freshly built firmware only
        shell: bash
        run: |
          VER="$(git describe --tags --dirty 2>/dev/null || echo dev)"
          echo "Build version dir: firmware/$VER"
          mkdir -p artifact
          cp "firmware/$VER/"*_factory.bin artifact/ 2>/dev/null || true
          cp ".pio/build/${{ matrix.env }}/firmware.bin" "artifact/${{ matrix.env }}_firmware.bin" 2>/dev/null || true
          ls -la artifact
      - name: Upload firmware binaries
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ matrix.env }}
          path: artifact/*
          if-no-files-found: warn
